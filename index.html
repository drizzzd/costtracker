<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mountain Tracker</title>
<style>
  :root{
    --ink:#142033;
    --muted:#7b8797;
    --line:#e7ebf0;
    --panel:#ffffff;
    --field:#ffffff;
    --bg:#f7f8fa;
    --dark:#09172a;
    --radius:3px;
    --new:#219ebc;
    --new-hover:#5ec5dc;
    --save:#90e0ef;
    --save-hover:#b8edf5;
  }

  *{box-sizing:border-box}

  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  }

  .app{max-width:1820px;margin:0 auto;padding:0 22px 42px}

  header{
    display:flex;align-items:center;justify-content:space-between;
    gap:18px;padding:0 0 14px;
  }

  h1{font-size:42px;line-height:1;margin:0;font-weight:850;letter-spacing:-.035em}

  .top-actions{display:flex;align-items:center;gap:12px}

  .grand{
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    height:60px;
    padding:0 34px;
    font-weight:850;
    font-size:26px;
    display:flex;
    align-items:center;
    box-shadow:0 1px 2px rgba(0,0,0,.03);
  }

  button{
    border:1px solid var(--line);
    background:#fff;
    border-radius:var(--radius);
    height:38px;
    padding:0 18px;
    font-weight:750;
    font-size:12px;
    color:var(--ink);
    cursor:pointer;
    box-shadow:0 1px 1px rgba(0,0,0,.02);
  }

  button:hover{background:#f1f4f7}

  #saveBtn,
  #addBoard{
    height:60px;
    padding:0 26px;
    font-size:22px;
    font-weight:850;
  }

  #saveBtn{
    background:var(--save);
    border-color:var(--save);
  }

  #saveBtn:hover{
    background:var(--save-hover);
    border-color:var(--save-hover);
  }

  #addBoard{
    background:var(--new);
    border-color:var(--new);
    color:#fff;
  }

  #addBoard:hover{
    background:var(--new-hover);
    border-color:var(--new-hover);
  }

  .boards{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(520px,1fr));
    gap:16px;align-items:start
  }

  .board{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.025)
  }

  .board-head{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:16px 17px 14px;border-bottom:1px solid var(--line)
  }

  .board-title{
    border:0;background:transparent;font-size:18px;font-weight:850;
    padding:0;margin:0;min-width:0;width:100%;color:#111827
  }

  .board-total{font-weight:850;font-size:14px;white-space:nowrap}

  .board-tools{padding:14px 17px;display:flex;gap:8px;border-bottom:1px solid var(--line)}

  .section{padding:9px 17px 4px}

  .section-head{
    display:grid;grid-template-columns:38px 1fr auto auto 76px;gap:8px;align-items:center;
    padding:6px 0 7px;border-bottom:1px solid var(--line)
  }

  .collapse{
    width:38px;height:38px;padding:0;border-radius:var(--radius);line-height:1;font-size:13px;
    display:flex;align-items:center;justify-content:center;color:#334155
  }

  .section-title{
    border:0;background:transparent;color:#7c8797;font-size:12px;font-weight:900;
    letter-spacing:.02em;text-transform:uppercase;padding:0;min-width:0;width:100%
  }

  .section-total{font-size:12px;color:#7c8797;font-weight:800;white-space:nowrap}

  .delete-section{
    background:var(--dark);color:#fff;border:0;border-radius:var(--radius);
    width:76px;height:38px;padding:0;display:flex;align-items:center;justify-content:center;
    font-size:18px;
  }

  .rows{padding:7px 0 6px}

  .row{
    display:grid;
    grid-template-columns:26px 1fr 132px 24px 38px;
    gap:8px;
    align-items:center;
    margin:7px 0;
  }

  .drag-handle{
    height:38px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:grab;
    color:#7b8797;
    font-weight:900;
    user-select:none;
  }

  .drag-handle:active{cursor:grabbing}
  .row.dragging{opacity:.45}

  input{
    height:38px;border:1px solid var(--line);border-radius:var(--radius);background:var(--field);
    padding:0 11px;color:#111827;font-weight:650;outline:none;
  }

  input:focus{border-color:#9aa8ba;box-shadow:0 0 0 3px rgba(100,116,139,.12)}

  .desc{width:100%}
  .cost{width:100%;text-align:left}

  .move-btn{
    height:18px;width:24px;padding:0;display:flex;align-items:center;justify-content:center;
    color:#475569;background:#fff;border-radius:var(--radius);font-size:12px;line-height:1
  }

  .move-stack{height:38px;display:flex;flex-direction:column;gap:2px;align-items:center;justify-content:center}

  .delete-row{
    height:38px;width:38px;padding:0;background:var(--dark);color:#fff;border:0;border-radius:var(--radius);
    display:flex;align-items:center;justify-content:center;font-size:18px;line-height:1
  }

  .section.collapsed .rows{display:none}
  .section.collapsed .collapse{transform:rotate(-90deg)}
  .empty{padding:28px 17px;color:var(--muted);font-weight:650}

  @media (max-width:700px){
    .app{padding:8px 10px 30px}
    header{align-items:flex-start}
    h1{font-size:32px}
    .boards{grid-template-columns:1fr}
    .row{grid-template-columns:24px 1fr 105px 24px 34px}
  }
</style>
</head>
<body>
<!-- rest of file unchanged -->
</body>
</html>
